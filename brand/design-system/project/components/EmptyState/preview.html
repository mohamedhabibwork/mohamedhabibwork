(function () {
  var h = React.createElement, M = window.MH;
  function Demo() {
    return h(M.EmptyState,{icon:"code",title:"No projects yet",description:"Add your first project to show it on your portfolio.",action:h(M.Button,{size:"sm",leadingIcon:"plus"},"Add project")});
